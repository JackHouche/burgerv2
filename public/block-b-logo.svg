<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background decorative elements -->
  <circle cx="20" cy="20" r="3" fill="#FF7A00" opacity="0.8"/>
  <circle cx="30" cy="15" r="2" fill="#FF7A00" opacity="0.6"/>
  <circle cx="170" cy="65" r="3" fill="#FF7A00" opacity="0.8"/>
  <circle cx="180" cy="60" r="2" fill="#FF7A00" opacity="0.6"/>

  <!-- Main BLOCK B Text with texture effect -->
  <g>
    <!-- Drop shadow -->
    <text x="2" y="47" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#000" opacity="0.3">BLOCK B</text>

    <!-- Main text with outline -->
    <text x="0" y="45" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="white" stroke="#2d2d2d" stroke-width="1">BLOCK B</text>

    <!-- Texture overlay -->
    <text x="0" y="45" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="url(#texturePattern)" opacity="0.3">BLOCK B</text>
  </g>

  <!-- Decorative lines -->
  <line x1="10" y1="55" x2="50" y2="55" stroke="#FF7A00" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="55" x2="190" y2="55" stroke="#FF7A00" stroke-width="2" stroke-linecap="round"/>

  <!-- Small decorative circles -->
  <circle cx="60" cy="55" r="2" fill="#FF7A00"/>
  <circle cx="70" cy="55" r="2" fill="#FF7A00" opacity="0.7"/>
  <circle cx="80" cy="55" r="2" fill="#FF7A00"/>
  <circle cx="120" cy="55" r="2" fill="#FF7A00"/>
  <circle cx="130" cy="55" r="2" fill="#FF7A00" opacity="0.7"/>
  <circle cx="140" cy="55" r="2" fill="#FF7A00"/>

  <!-- Subtitle -->
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">PRODUITS FRAIS & LOCAUX</text>

  <!-- Texture pattern definition -->
  <defs>
    <pattern id="texturePattern" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="white"/>
      <circle cx="2" cy="2" r="1" fill="#ddd" opacity="0.5"/>
    </pattern>
  </defs>
</svg>
